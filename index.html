<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Solaire 3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="scene-container"></div>

    <!-- Barre de titre minimale -->
    <header id="topbar">
        <h1>SYSTÈME SOLAIRE</h1>
        <p>Simulation interactive — échelle pédagogique</p>
    </header>

    <!-- Fiche détaillée (planète ou lune) -->
    <aside id="detail-panel">
        <button id="close-panel" title="Fermer">✕</button>
        <span id="detail-tag"></span>
        <h2 id="detail-name"></h2>
        <div id="planet-preview-container"></div>
        <table class="detail-table"><tbody id="detail-table-body"></tbody></table>
        <div id="detail-moons"></div>
        <p id="detail-description"></p>
        <label class="detail-rotate">
            <input type="checkbox" id="detail-auto-rotate" checked>
            Rotation automatique de l'aperçu
        </label>
    </aside>

    <!-- Popover effets & extras (onglets) -->
    <div id="effects-popover">
        <div class="popover-tabs">
            <button class="popover-tab active" data-tab="effets">Effets</button>
            <button class="popover-tab" data-tab="affichage">Affichage</button>
            <button class="popover-tab" data-tab="starship">StarShip</button>
        </div>

        <section class="popover-panel active" data-panel="effets">
            <div class="popover-grid">
                <button class="effect-btn" data-effect="stars">✦ Étoiles</button>
                <button class="effect-btn" data-effect="constellations">✶ Constellations</button>
                <button class="effect-btn" data-effect="nebula">☁ Nébuleuse</button>
                <button class="effect-btn" data-effect="meteor">☄ Météores</button>
                <button class="effect-btn" data-effect="asteroids">◦ Astéroïdes</button>
                <button class="effect-btn" data-effect="comet">⊃ Comète</button>
                <button class="effect-btn" data-effect="station">🛰 Station</button>
            </div>
            <label class="popover-check popover-subcheck"><input type="checkbox" id="zodiac-only"> Constellations : zodiaque uniquement</label>
        </section>

        <section class="popover-panel" data-panel="affichage">
            <label class="popover-check"><input type="checkbox" id="show-orbits" checked> Orbites</label>
            <label class="popover-check"><input type="checkbox" id="show-labels" checked> Noms des planètes</label>
            <label class="popover-label">Opacité des orbites <span id="orbit-opacity-value">50</span> %
                <input type="range" id="orbit-opacity" min="0" max="100" value="50">
            </label>
            <label class="popover-label">Volume <span id="audio-volume-value">50</span> %
                <input type="range" id="audio-volume" min="0" max="100" value="50">
            </label>
            <label class="popover-label">Échelle
                <select id="scale-mode"></select>
            </label>
            <p id="scale-mode-description"></p>
        </section>

        <section class="popover-panel" data-panel="starship">
            <button id="toggle-starship" class="popover-btn">Activer StarShip</button>
            <div id="starship-controls" style="display: none;">
                <div id="starship-status">
                    <div id="starship-status-text"></div>
                    <div class="mission-progress"><div id="starship-progress"></div></div>
                </div>
                <label class="popover-label">Destination
                    <select id="starship-target"></select>
                </label>
                <label class="popover-label">Propulsion <span id="starship-speed-value">1.0</span>×
                    <input type="range" id="starship-speed" min="0.5" max="4.0" step="0.5" value="1.0">
                </label>
                <button id="follow-starship" class="popover-btn">Suivre StarShip</button>
            </div>
        </section>

        <button id="reset-btn" class="popover-btn popover-footer-btn">Réinitialiser la simulation</button>
    </div>

    <!-- Dock cinéma -->
    <nav id="dock">
        <div id="dock-planets"></div>
        <div class="dock-sep"></div>
        <div class="dock-controls">
            <button id="pause-btn" class="dock-btn" title="Pause / Lecture (Espace)">❚❚</button>
            <input type="range" id="speed-slider" min="0" max="100" value="50" title="Vitesse de simulation">
            <span id="speed-value" title="Vitesse de simulation">×1.0</span>
            <button id="tour-btn">🚀 Visite guidée</button>
            <button id="effects-btn" class="dock-btn" title="Effets &amp; extras">✦</button>
            <button id="audio-btn" class="dock-btn" title="Activer le son">🔇</button>
            <button id="reset-camera-btn" class="dock-btn" title="Vue d'ensemble">⌖</button>
        </div>
    </nav>

    <!-- Aide navigation -->
    <div id="help-hint">clic gauche : orbite · molette : zoom · clic droit : pan</div>

    <!-- Voile de chargement -->
    <div id="loading-message">
        <span>Chargement du système solaire…</span>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
